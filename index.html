<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crypto Prince 2025 Giveaway</title>

<style>
    :root {
        --bg: #050510;
        --bg-alt: #0c0c1a;
        --accent: #ffcf40;
        --accent-soft: rgba(255, 207, 64, 0.13);
        --text-main: #f3f3ff;
        --text-soft: #c5c5d8;
        --card: #111122;
        --card-soft: #15152a;
        --radius-xl: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        background: radial-gradient(circle at top, #1a1a33 0, #050510 55%);
        color: var(--text-main);
        overflow-x: hidden;
    }

    main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 16px 80px;
    }

    section {
        min-height: 80vh;
        padding: 60px 0;
        opacity: 0;
        transform: translateY(60px);
        transition: 0.9s ease;
    }

    section.show {
        opacity: 1;
        transform: translateY(0);
    }

    /* HERO */
    .hero {
        min-height: 90vh;
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 32px;
        align-items: center;
        position: relative;
    }

    .hero::before {
        content: "";
        position: absolute;
        inset: -40%;
        background:
          radial-gradient(circle at 10% 0%, rgba(255, 207, 64, 0.08) 0, transparent 55%),
          radial-gradient(circle at 120% 20%, rgba(100, 149, 237, 0.18) 0, transparent 55%);
        opacity: 0.9;
        z-index: -1;
    }

    .brand-row {
        display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
    }

    .brand-logo {
        width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
        box-shadow: 0 0 18px rgba(0, 255, 120, 0.9);
        border: 2px solid rgba(0, 255, 120, 0.9); background: #000;
    }

    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }

    .brand-text {
        font-size: 0.86rem; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--text-soft); opacity: 0.9;
    }

    .hero-title {
        font-size: clamp(2.4rem, 4vw, 3.1rem);
        font-weight: 750; letter-spacing: 0.02em;
    }

    .hero-gradient {
        background: linear-gradient(120deg, #ffe58f, #ffd666, #ffc53d);
        -webkit-background-clip: text; color: transparent;
    }

    .hero-subtitle {
        margin-top: 20px; font-size: 1.12rem; color: var(--text-soft); line-height: 1.7;
    }

    .hero-pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 14px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 0.82rem; margin-bottom: 14px; color: var(--text-soft);
    }

    .hero-buttons {
        display: flex; gap: 14px; margin-top: 24px; flex-wrap: wrap;
    }

    .btn-primary, .btn-ghost {
        padding: 10px 20px; border-radius: 999px; border: none;
        cursor: pointer; font-size: 0.98rem; display: inline-flex;
        align-items: center; gap: 8px; text-decoration: none;
    }

    .btn-primary {
        background: linear-gradient(120deg, #ffcf40, #ffb100);
        color: #111; box-shadow: 0 0 25px rgba(255, 191, 0, 0.4);
    }

    .hero-card {
        background: radial-gradient(circle at top, #1c2140 0, #0a0a1a 55%);
        border-radius: var(--radius-xl);
        padding: 20px 20px 18px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.6);
        position: relative;
    }

    .hero-image-wrapper {
        margin-top: 16px; border-radius: 18px;
        overflow: hidden; background: #000;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero-image-wrapper img { width: 100%; display: block; }

    h2 { font-size: 1.9rem; margin-bottom: 10px; color: var(--text-main); }

    .section-tag {
        font-size: 0.8rem; text-transform: uppercase;
        letter-spacing: 0.18em; color: var(--accent); opacity: 0.9;
    }

    .divider {
        width: 70px; height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffcf40, transparent);
        margin: 14px 0 18px;
    }

    p { font-size: 1.02rem; color: var(--text-soft); line-height: 1.7; max-width: 780px; }
</style>
</head>

<body>
<main>

<!-- HERO -->
<section class="hero">
    <div>
        <div class="brand-row">
            <div class="brand-logo">
                <img src="IMG_20251201_025022_480.jpg" alt="Crypto Prince Community Logo" />
            </div>
            <div class="brand-text">
                CRYPTO PRINCE COMMUNITY • CHRISTMAS 2024 → 2025
            </div>
        </div>

        <div class="hero-pill">
            <span>🎄</span> One event · Global · 2025
        </div>

        <h1 class="hero-title">
            Crypto Prince <span class="hero-gradient">2025 Giveaway</span>
        </h1>

        <!-- UPDATED SIMPLIFIED LINE (Option 2) -->
        <p class="hero-subtitle">
            Christmas 2025 KAI campaign with Crypto Prince and 6 KOLs:  
            50% deposit bonus for new users who complete KYC and make their first deposit.
        </p>

        <div class="hero-buttons">
            <a href="#mechanics" class="btn-primary">View Mechanics ⬇</a>
            <a href="#momentum" class="btn-ghost">Past Performance Proof</a>
        </div>
    </div>

    <div class="hero-card">
        <div class="hero-image-wrapper">
            <img src="crypto_prince_tweet.png" alt="Crypto Prince past giveaway tweet" />
        </div>
    </div>
</section>

<!-- (The rest of the content stays the same) -->

</main>

<script>
    const sections = document.querySelectorAll("section");
    function reveal() {
        const trigger = window.innerHeight * 0.85;
        sections.forEach(sec => {
            if (sec.getBoundingClientRect().top < trigger) {
                sec.classList.add("show");
            }
        });
    }
    window.addEventListener("scroll", reveal);
    window.addEventListener("load", reveal);
</script>

</body>
</html>
